services:
  # --- NGINX API GATEWAY & REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: bizbot-gateway
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  # --- FRONTEND CLIENT (REACT 19 + VITE) ---
  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: bizbot-frontend
    restart: always
    environment:
      - VITE_PUBLIC_API_URL=/api/v1
    ports:
      - '3000:80'

  # --- BACKEND API (NODE 22 + EXPRESS 5 + RAG) ---
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    container_name: bizbot-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/bizbot_enterprise
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT=http://minio:9000
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - redis
      - qdrant

  # --- OPERATIONAL DATABASE (MONGODB 8) ---
  mongodb:
    image: mongo:8.0
    container_name: bizbot-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  # --- IN-MEMORY CACHE & RATE LIMITING (REDIS 7) ---
  redis:
    image: redis:7-alpine
    container_name: bizbot-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # --- MULTI-TENANT VECTOR STORE (QDRANT) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bizbot-qdrant
    restart: always
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  # --- S3 COMPATIBLE OBJECT STORAGE (MINIO) ---
  minio:
    image: minio/minio:latest
    container_name: bizbot-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
  minio_data:
